<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>000371340 - StudySpaces</title>
    <link rel="icon" href="data:," />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="container py-4">
      <h1 class="display-6 fw-medium">StudySpaces</h1>

      <p id="status" class="text-danger"></p>

      <div
        class="d-flex flex-wrap gap-2 align-items-center mb-2"
        id="filterBar"
      >
        <span class="text-muted small me-2">Filter:</span>
        <button class="btn btn-sm btn-dark" type="button" data-filter="all">
          All
        </button>
        <button
          class="btn btn-sm btn-outline-dark"
          type="button"
          data-filter="library"
        >
          Libraries
        </button>
        <button
          class="btn btn-sm btn-outline-dark"
          type="button"
          data-filter="cafe"
        >
          Cafes
        </button>
        <button
          class="btn btn-sm btn-outline-dark"
          type="button"
          data-filter="quiet"
        >
          Quiet
        </button>
        <button
          class="btn btn-sm btn-outline-dark"
          type="button"
          data-filter="study"
        >
          Study
        </button>
        <button
          class="btn btn-sm btn-outline-dark"
          type="button"
          data-filter="late"
        >
          Late
        </button>
      </div>

      <div class="d-flex gap-2 align-items-center mb-2">
        <button
          id="myLocationBtn"
          class="btn btn-outline-secondary btn-sm"
          type="button"
        >
          Use my location
        </button>
        <div class="text-muted small">(Requires location permission)</div>
      </div>

      <div id="map" class="rounded border"></div>

      <hr class="my-4" />

      <div class="mb-4">
        <h2 class="h6">Add a location (custom marker)</h2>
        <div class="row g-2">
          <div class="col-12 col-md-6">
            <label for="addName" class="form-label mb-1">Name</label>
            <input
              id="addName"
              class="form-control"
              type="text"
              placeholder="e.g. Costco Wholesale, Ancaster"
            />
          </div>
          <div class="col-12 col-md-6">
            <label for="addCategory" class="form-label mb-1">Category</label>
            <select id="addCategory" class="form-select">
              <option value="cafe" selected>Cafe</option>
              <option value="library">Library</option>
              <option value="quiet">Quiet</option>
              <option value="study">Study</option>
              <option value="late">Late</option>
            </select>
          </div>

          <div class="col-12">
            <label for="addAddress" class="form-label mb-1"
              >Address (optional)</label
            >
            <input
              id="addAddress"
              class="form-control"
              type="text"
              placeholder="Optional address"
            />
          </div>

          <div class="col-12">
            <label for="addNotes" class="form-label mb-1">Notes</label>
            <textarea id="addNotes" class="form-control" rows="2"></textarea>
          </div>

          <div class="col-12">
            <div class="row g-2">
              <div class="col-6">
                <label for="addLat" class="form-label mb-1">Latitude</label>
                <input
                  id="addLat"
                  class="form-control"
                  type="number"
                  step="any"
                />
              </div>
              <div class="col-6">
                <label for="addLng" class="form-label mb-1">Longitude</label>
                <input
                  id="addLng"
                  class="form-control"
                  type="number"
                  step="any"
                />
              </div>
            </div>
            <div class="form-text" id="addGeoMeta"></div>
          </div>

          <div class="col-12 d-flex gap-2 flex-wrap">
            <button
              id="addGeoBtn"
              class="btn btn-outline-primary"
              type="button"
            >
              Search lat/lng (Google)
            </button>
            <button
              id="useMyCoordsBtn"
              class="btn btn-outline-primary"
              type="button"
            >
              Use my coords
            </button>
            <button id="addMarkerBtn" class="btn btn-success" type="button">
              Add green marker
            </button>
          </div>

          <div class="col-12">
            <div class="form-text" id="customSaveMeta"></div>
          </div>
        </div>
      </div>

      <hr class="my-4" />

      <div class="mb-4">
        <h2 class="h6">Directions</h2>
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-8">
            <label for="directionsTo" class="form-label mb-1"
              >Destination</label
            >
            <select id="directionsTo" class="form-select">
              <option value="" selected>Select a destination…</option>
            </select>
          </div>
          <div class="col-12 col-md-4 d-grid gap-2">
            <button
              id="directionsBtn"
              class="btn btn-outline-success"
              type="button"
            >
              Show directions on map
            </button>
            <button
              id="clearDirectionsBtn"
              class="btn btn-outline-secondary"
              type="button"
            >
              Clear directions
            </button>
          </div>
        </div>
        <div class="form-text mt-2" id="directionsMeta"></div>
      <div class="small text-muted">
        Tip: run a local server (required for fetch + geolocation permissions).
        For example: <code>python3 -m http.server 8000</code>
      </div>
    </div>
  </body>
</html>
