<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>000371340 - StudySpaces</title>
    <link rel="icon" href="data:," />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="container py-4">
      <h1 class="display-6 fw-medium">Cultivate your next Study Session.</h1>

      <p id="status" class="text-danger"></p>

      <hr />

      <h2 class="h5">Map</h2>

      <div class="d-flex flex-wrap gap-2 align-items-center mb-2" id="filterBar">
        <span class="text-muted small me-2">Filter:</span>
        <button class="btn btn-sm btn-dark" type="button" data-filter="all">All</button>
        <button class="btn btn-sm btn-outline-dark" type="button" data-filter="library">Libraries</button>
        <button class="btn btn-sm btn-outline-dark" type="button" data-filter="cafe">Cafes</button>
        <button class="btn btn-sm btn-outline-dark" type="button" data-filter="quiet">Quiet</button>
        <button class="btn btn-sm btn-outline-dark" type="button" data-filter="study">Study</button>
        <button class="btn btn-sm btn-outline-dark" type="button" data-filter="late">Late</button>
      </div>

      <div class="d-flex gap-2 align-items-center mb-2">
        <button id="myLocationBtn" class="btn btn-outline-secondary btn-sm" type="button">
          Use my location
        </button>
        <div class="text-muted small">
          (Requires location permission)
        </div>
      </div>
      
      <div id="map" class="rounded border"></div>

      <div class="mt-3 mb-5">
        <h3 class="h6">Find precise coordinates</h3>
        <p class="text-muted mb-2">
          Enter a place name or address to get a more accurate
          latitude/longitude.
        </p>

        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-8">
            <label for="geoQuery" class="form-label mb-1"
              >Place name / address</label
            >
            <input
              id="geoQuery"
              class="form-control"
              type="text"
              placeholder="e.g. Mills Memorial Library, Hamilton"
              autocomplete="off"
            />
          </div>
          <div class="col-12 col-md-4 d-grid">
            <button id="geoBtn" class="btn btn-primary" type="button">
              Get lat/lng
            </button>
          </div>
        </div>

        <div class="mt-3">
          <div class="row g-2">
            <div class="col-12 col-md-6">
              <label class="form-label mb-1">Latitude</label>
              <input id="geoLat" class="form-control" type="text" readonly />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label mb-1">Longitude</label>
              <input id="geoLng" class="form-control" type="text" readonly />
            </div>
          </div>
          <div class="form-text mt-2" id="geoMeta"></div>
        </div>
      </div>
    </div>
  </body>
</html>
